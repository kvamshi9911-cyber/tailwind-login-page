<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-gradient-to-r from-orange-400 via-orange-200 to-red-300  flex justify-center items-center min-h-screen ">
    <div class="bg-gradient-to-br from-yellow--100 to-yellow-300  space-y-4 p-6 rounded-xl shadow-lg w-96">
        <h1 class="text-3xl font-bold text-center text-mauve-600 m-0">Welcome Back</h1>
        <p class="text-center text-mauve-600 m-0 ">
            Login to your account
        </p>
        <form class="space-y-4">
            <div>
                <label class="block text-mauve-600 font-medium mb-2">
                    User Name:
                    <input input="name" : placeholder="Enter the user name">
                </label>
                <label class="block text-mauve-600 font-medium mb-2">
                    Email id :
                    <input input="Email" placeholder="Enter the valid Email id">
                </label>
                <label class="block text-mauve-600 font-medium mb-2">
                    Password:
                    <input type="password" : placeholder="enter the Password">
                </label>
                <div class="flex justify-between items-center ">
                    <label class="flex items-center mr-2">
                        <input type="checkbox"> Remember me
                    </label>
                    <a class="bg-amber-300 text-sm hover:underline">Forgot password
                </div>
                <button
                    class="w-full  bg-gradient-to-r from-orange-500 to-red-600 text-white py-2 rounded-md ">Login</button>
                <p class="text-center mt-6 text-mauve-600 hover:underline">Don't have an account? Sign Up</p>


            </div>
        </form>
    </div>
</body>
</html>
